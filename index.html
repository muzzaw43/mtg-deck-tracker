<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTG Decks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<title>MTG Deck Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MTG Deck Tracker</h1>
  <span id="status" class="muted"></span>
  <button id="refresh" title="Refresh the app (clears its saved copy and reloads)" aria-label="Refresh">⟳</button>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="decks">Decks</button>
  <button data-tab="collection">Collection</button>
  <button data-tab="check">Check</button>
  <button data-tab="trades">Trades</button>
  <button data-tab="wishlist">Wishlist</button>
  <button data-tab="data">Data</button>
</nav>
<script src="site-config.js"></script>
<script src="logic.js"></script>
<script src="scan.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
</body>
</html>
